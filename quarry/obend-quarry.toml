# Obend Cathedral + `refs/quarry/<donor>/*` Namespace Manifest
# Managed and audited by `obb quarry {sync, status, inspect}`.
#
# Every donor repository's full git history is fetched into `refs/quarry/<donor>/<branch>`
# (`--no-tags --no-write-fetch-head`), leaving `HEAD`, `.git/index`, and the working tree untouched.
# No code crosses from `refs/quarry/*` into `obend` without passing all 6 Quarry Surgery Gates!

version = 1
target_name = "obend"
default_target_repo = "/Users/ember/dev/obend"

[donors.breadstuffs]
path = "/Users/ember/dev/breadstuffs"
branches = ["main"]
default_branch = "main"
language = "Lean 4 + Rust + seL4 Microkit + Verilog"
summary = "Dregg2 metatheory, Realizability/Paco, CertifiedPresentation CCC, BFV/Polis, 13-family Automata/Datalog/Policy/Tree zoo, calltree, seL4 firmament, braid-hook, confined-swarm, and UMEM/Convex specs"

[donors.minidregg]
path = "/Users/ember/dev/minidregg"
branches = ["main"]
default_branch = "main"
language = "Lean 4 + Rust + Python"
summary = "Resource Book/Floors & ZoE Seat accounting, Pred can/why refusal algebra, TokenCensus, HypothesisLedger anti-vacuity tool, Tower256 binary field backend, GenericSimplex quorum, and IrreversibleEffectSettlement"

[donors.svenvs]
path = "/Users/ember/dev/svenvs"
branches = ["main"]
default_branch = "main"
language = "HOL4 + OCaml/Candle"
summary = "Self-verifying environments: Genealogy non-regression, sv_weakening/liberty, relEnvelope, corrigibility, specneg, Proof-Carrying Authorization (PCA), physical embodiment, and Candle self-upgrade"

[donors.lean-transport]
path = "/Users/ember/dev/lean-transport"
branches = ["dev"]
default_branch = "dev"
language = "Lean 4"
summary = "Shadow-olean DAG walk (`--no-repair` spec-sensitivity census & bounded proof-repair engine for `obb repair`)"

