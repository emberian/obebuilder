[workspace]
resolver = "2"
members = [
    "crates/obb-core",
    "crates/obb-lint",
    "crates/obb-judge",
    "crates/obb-state",
    "crates/obb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ember"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
walkdir = "2.5"

obb-core = { path = "crates/obb-core" }
obb-lint = { path = "crates/obb-lint" }
obb-judge = { path = "crates/obb-judge" }
obb-state = { path = "crates/obb-state" }
